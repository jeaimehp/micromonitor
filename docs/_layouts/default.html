<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#0b0f14">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/images/hero.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="{{ '/images/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>document.documentElement.classList.add("js");</script>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" translate="no">
        <img src="{{ '/images/app_icon.png' | relative_url }}" alt="" width="32" height="32">
        <span><b>µ</b>Monitor</span>
      </a>

      <div class="header-tools">
        <label class="lang" translate="no">
          <span class="visually-hidden">Language</span>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm-9 9h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
          <select id="lang-select">
            {% for l in site.languages %}<option value="{{ l.code }}">{{ l.name }}</option>{% endfor %}
          </select>
        </label>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
          <span class="visually-hidden">Menu</span>
          <span class="bars" aria-hidden="true"></span>
        </button>
      </div>

      <nav class="site-nav" id="site-nav" aria-label="Main">
        {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
        <a href="{{ site.repo }}">GitHub</a>
      </nav>
    </div>
  </header>

  <main id="main" class="{% if page.wide %}wide{% else %}wrap content{% endif %}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>µMonitor is open source under the <a href="{{ site.repo }}/blob/main/LICENSE">MIT license</a>.
        Questions? <a href="mailto:{{ site.email }}" translate="no">{{ site.email }}</a></p>
      <p class="translate-note" hidden>This page was translated automatically by Google Translate. The
        <a href="#" data-lang="en">English version</a> is the original.</p>
    </div>
  </footer>
  <div id="google_translate_element" hidden></div>
</body>
</html>
